<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="What carries over from one EA Sports FC to the next in Ultimate Team: only the FC Points you paid for, your club name, and your Rivals division rank. Everything you earned is deleted, including every player card, every coin, every unopened pack, and all of your season XP.">
  <rect width="1200" height="630" rx="20" fill="#ffffff"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="30" font-weight="800" fill="#0f172a">What survives into next year's game</text>
    <text x="600" y="104" font-size="17" font-weight="600" fill="#64748b">Ultimate Team carries forward the money you spent, and almost nothing you earned</text>
  </g>

  <!-- Kept -->
  <g>
    <rect x="90" y="150" width="480" height="300" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="330" y="200" font-size="21" font-weight="800" fill="#3b82f6">Carried over</text>
      <text x="330" y="256" font-size="17" font-weight="700" fill="#475569">The FC Points you paid for</text>
      <text x="330" y="294" font-size="17" font-weight="700" fill="#475569">Your club name</text>
      <text x="330" y="332" font-size="17" font-weight="700" fill="#475569">Your Rivals division rank</text>
      <rect x="180" y="372" width="300" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="330" y="394" font-size="14" font-weight="700" fill="#3b82f6">Three things. One of them is money.</text>
    </g>
  </g>

  <!-- Deleted -->
  <g>
    <rect x="630" y="150" width="480" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="870" y="200" font-size="21" font-weight="800" fill="#0f172a">Deleted</text>
      <text x="870" y="248" font-size="17" font-weight="700" fill="#64748b">Every player card in your club</text>
      <text x="870" y="284" font-size="17" font-weight="700" fill="#64748b">Every coin you ground out</text>
      <text x="870" y="320" font-size="17" font-weight="700" fill="#64748b">Every unopened pack</text>
      <text x="870" y="356" font-size="17" font-weight="700" fill="#64748b">All of your season XP</text>
      <rect x="720" y="386" width="300" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="870" y="408" font-size="14" font-weight="700" fill="#94a3b8">A season of evenings, gone in one patch.</text>
    </g>
  </g>

  <text x="600" y="504" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">You have already quit. Every September, the game does it for you.</text>
  <text x="600" y="544" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b">If the cards were what held you, the annual wipe would have ended this years ago.</text>
  <text x="600" y="584" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">It did not. So the cards were never the thing. The pack was.</text>
</svg>
