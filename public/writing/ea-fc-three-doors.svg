<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ultimate Team runs on three surfaces: the game on your console or PC, the Companion app on your phone, and the Web App in any browser. Uninstalling the game closes one of the three and leaves the packs, the transfer market and the squad building challenges open on the other two.">
  <rect width="1200" height="630" rx="20" fill="#ffffff"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="30" font-weight="800" fill="#0f172a">Uninstalling closes one door of three</text>
    <text x="600" y="104" font-size="17" font-weight="600" fill="#64748b">Ultimate Team also runs in a browser and on your phone, with the console switched off</text>
  </g>

  <!-- 1. The game -->
  <g>
    <rect x="90" y="160" width="320" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="250" cy="216" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="250" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#3b82f6">1</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="250" y="288" font-size="21" font-weight="800" fill="#0f172a">The game</text>
      <text x="250" y="326" font-size="16" font-weight="600" fill="#64748b">Console or PC. Matches,</text>
      <text x="250" y="350" font-size="16" font-weight="600" fill="#64748b">Rivals and Champions</text>
      <rect x="150" y="380" width="200" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="250" y="401" font-size="14" font-weight="700" fill="#94a3b8">Closed by uninstall</text>
    </g>
  </g>

  <!-- 2. The Companion app -->
  <g>
    <rect x="440" y="160" width="320" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="600" cy="216" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="600" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#3b82f6">2</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="600" y="288" font-size="21" font-weight="800" fill="#0f172a">The Companion app</text>
      <text x="600" y="326" font-size="16" font-weight="600" fill="#64748b">In your pocket. Packs,</text>
      <text x="600" y="350" font-size="16" font-weight="600" fill="#64748b">market, SBCs, rewards</text>
      <rect x="500" y="380" width="200" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="600" y="401" font-size="14" font-weight="700" fill="#0f172a">Still open</text>
    </g>
  </g>

  <!-- 3. The Web App -->
  <g>
    <rect x="790" y="160" width="320" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="950" cy="216" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="950" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#3b82f6">3</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="950" y="288" font-size="21" font-weight="800" fill="#0f172a">The Web App</text>
      <text x="950" y="326" font-size="16" font-weight="600" fill="#64748b">Any browser, any desk,</text>
      <text x="950" y="350" font-size="16" font-weight="600" fill="#64748b">no console required</text>
      <rect x="850" y="380" width="200" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="950" y="401" font-size="14" font-weight="700" fill="#0f172a">Still open</text>
    </g>
  </g>

  <text x="600" y="520" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">You can delete the game and still spend a lunch break inside your club.</text>
  <text x="600" y="560" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Take the phone first. It is the surface you actually use, and the one nobody removes.</text>
</svg>
