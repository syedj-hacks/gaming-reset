<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How many hours of gaming is too much? It is not the number, it is the cost to your sleep, work, relationships, and mood.">
  <defs>
    <radialGradient id="gl" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#07090f"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#gl)"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="164" font-size="19" font-weight="800" letter-spacing="4" fill="#60a5fa">HOW MANY HOURS IS TOO MUCH?</text>

    <text x="600" y="300" font-size="66" font-weight="800" fill="#f8fafc">It is not the number.</text>
    <text x="600" y="378" font-size="66" font-weight="800" fill="#3b82f6">It is the cost.</text>

    <text x="600" y="480" font-size="22" font-weight="600" fill="#94a3b8">
      Sleep
      <tspan fill="#3b82f6" dx="14" dy="0">&#8226;</tspan>
      <tspan fill="#94a3b8" dx="14">Work</tspan>
      <tspan fill="#3b82f6" dx="14">&#8226;</tspan>
      <tspan fill="#94a3b8" dx="14">Relationships</tspan>
      <tspan fill="#3b82f6" dx="14">&#8226;</tspan>
      <tspan fill="#94a3b8" dx="14">Mood</tspan>
    </text>
  </g>
</svg>
