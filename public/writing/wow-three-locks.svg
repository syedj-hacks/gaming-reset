<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Uninstalling World of Warcraft removes the client and nothing else. The recurring subscription keeps billing, the guild raid calendar still has your name on it, and the weekly reset still turns a week away into an empty Great Vault.">
  <rect width="1200" height="630" rx="20" fill="#ffffff"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="64" font-size="30" font-weight="800" fill="#0f172a">Uninstalling removes one lock of four</text>
    <text x="600" y="98" font-size="17" font-weight="600" fill="#64748b">The client is the only part of this that lives on your hard drive</text>
  </g>

  <!-- What the uninstall actually removes -->
  <rect x="90" y="128" width="1020" height="92" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="166" font-size="20" font-weight="800" fill="#0f172a">The client</text>
    <text x="600" y="196" font-size="16" font-weight="600" fill="#94a3b8">Around 100 GB of files. Deleted in four minutes, redownloaded in twenty.</text>
  </g>

  <!-- 1. The subscription -->
  <g>
    <rect x="90" y="248" width="320" height="252" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="250" cy="296" r="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="250" y="304" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#3b82f6">1</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="250" y="360" font-size="20" font-weight="800" fill="#0f172a">The subscription</text>
      <text x="250" y="396" font-size="15" font-weight="600" fill="#475569">Recurs on the rate you chose</text>
      <text x="250" y="418" font-size="15" font-weight="600" fill="#475569">until you cancel it</text>
      <rect x="140" y="440" width="220" height="32" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="250" y="461" font-size="14" font-weight="700" fill="#3b82f6">Still billing</text>
    </g>
  </g>

  <!-- 2. The raid calendar -->
  <g>
    <rect x="440" y="248" width="320" height="252" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="600" cy="296" r="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="600" y="304" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#3b82f6">2</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="600" y="360" font-size="20" font-weight="800" fill="#0f172a">The raid calendar</text>
      <text x="600" y="396" font-size="15" font-weight="600" fill="#475569">Other people booked those</text>
      <text x="600" y="418" font-size="15" font-weight="600" fill="#475569">evenings around you</text>
      <rect x="490" y="440" width="220" height="32" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="600" y="461" font-size="14" font-weight="700" fill="#3b82f6">Still scheduled</text>
    </g>
  </g>

  <!-- 3. The weekly reset -->
  <g>
    <rect x="790" y="248" width="320" height="252" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="950" cy="296" r="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="950" y="304" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#3b82f6">3</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="950" y="360" font-size="20" font-weight="800" fill="#0f172a">The weekly reset</text>
      <text x="950" y="396" font-size="15" font-weight="600" fill="#475569">A week away shows up as</text>
      <text x="950" y="418" font-size="15" font-weight="600" fill="#475569">an empty Great Vault</text>
      <rect x="840" y="440" width="220" height="32" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="950" y="461" font-size="14" font-weight="700" fill="#3b82f6">Still counting</text>
    </g>
  </g>

  <text x="600" y="552" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Only one of these four is a button on your desktop.</text>
  <text x="600" y="590" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Cancel the billing, tell the guild, let the first reset pass. That is the real list.</text>
</svg>
