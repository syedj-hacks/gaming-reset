<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="Craving intensity after you stop playing: cravings rise to a peak within the first few days, then fade noticeably over the following weeks.">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="560" rx="20" fill="#ffffff"/>

  <!-- titles -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="520" y="58" font-size="26" font-weight="800" fill="#0f172a">What the first two weeks feel like</text>
    <text x="520" y="88" font-size="16" font-weight="600" fill="#64748b">Craving intensity after you stop playing</text>
  </g>

  <!-- baseline -->
  <line x1="90" y1="440" x2="980" y2="440" stroke="#e2e8f0" stroke-width="2"/>

  <!-- area under the curve -->
  <path d="M90 340 C 170 280, 250 150, 320 140 C 430 150, 540 300, 660 360 C 780 400, 880 420, 980 428 L 980 440 L 90 440 Z" fill="url(#area)"/>
  <!-- the curve -->
  <path d="M90 340 C 170 280, 250 150, 320 140 C 430 150, 540 300, 660 360 C 780 400, 880 420, 980 428" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- peak marker -->
  <circle cx="320" cy="140" r="7" fill="#ffffff" stroke="#3b82f6" stroke-width="4"/>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="320" y="118" font-size="16" font-weight="800" fill="#0f172a">Peak</text>
    <text x="320" y="500" font-size="14" font-weight="600" fill="#94a3b8"> </text>
  </g>

  <!-- end marker -->
  <circle cx="980" cy="428" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="4"/>
  <text x="946" y="410" font-family="'Segoe UI', Arial, sans-serif" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">much easier</text>

  <!-- x axis labels -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">
    <text x="90"  y="472">Day 0</text>
    <text x="320" y="472">First few days</text>
    <text x="580" y="472">Week 1</text>
    <text x="980" y="472">Week 2</text>
  </g>

  <text x="520" y="524" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">The urge peaks early, then loses its grip. Getting past the first few days is the hard part.</text>
</svg>
