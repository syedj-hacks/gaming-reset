<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Counter-Strike is three separate habits stacked into one game: the rating, which resets every season so the climb never ends; the cases, which are a paid lottery that drops for free during matches; and the inventory, which holds real money you can look up. Uninstalling the game interrupts only the first one.">
  <rect width="1200" height="630" rx="20" fill="#ffffff"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="30" font-weight="800" fill="#0f172a">Counter-Strike is three habits, not one</text>
    <text x="600" y="104" font-size="17" font-weight="600" fill="#64748b">Uninstalling interrupts the first one and leaves the other two running</text>
  </g>

  <!-- 1. The rating -->
  <g>
    <rect x="90" y="160" width="320" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="250" cy="216" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="250" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#3b82f6">1</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="250" y="288" font-size="21" font-weight="800" fill="#0f172a">The rating</text>
      <text x="250" y="326" font-size="16" font-weight="600" fill="#64748b">Soft resets every season,</text>
      <text x="250" y="350" font-size="16" font-weight="600" fill="#64748b">so the climb never ends</text>
      <rect x="150" y="380" width="200" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="250" y="401" font-size="14" font-weight="700" fill="#94a3b8">Interrupted by uninstall</text>
    </g>
  </g>

  <!-- 2. The cases -->
  <g>
    <rect x="440" y="160" width="320" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="600" cy="216" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="600" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#3b82f6">2</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="600" y="288" font-size="21" font-weight="800" fill="#0f172a">The cases</text>
      <text x="600" y="326" font-size="16" font-weight="600" fill="#64748b">A paid lottery that drops</text>
      <text x="600" y="350" font-size="16" font-weight="600" fill="#64748b">for free while you play</text>
      <rect x="500" y="380" width="200" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="600" y="401" font-size="14" font-weight="700" fill="#0f172a">Still there after</text>
    </g>
  </g>

  <!-- 3. The inventory -->
  <g>
    <rect x="790" y="160" width="320" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="950" cy="216" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="950" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#3b82f6">3</text>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="950" y="288" font-size="21" font-weight="800" fill="#0f172a">The inventory</text>
      <text x="950" y="326" font-size="16" font-weight="600" fill="#64748b">Real money, with a price</text>
      <text x="950" y="350" font-size="16" font-weight="600" fill="#64748b">you can refresh any time</text>
      <rect x="850" y="380" width="200" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="950" y="401" font-size="14" font-weight="700" fill="#0f172a">Still there after</text>
    </g>
  </g>

  <text x="600" y="520" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Remove the game, keep two of the three, and the reinstall is only a matter of time.</text>
  <text x="600" y="560" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">A plan that works has to answer all three, in the order that suits you.</text>
</svg>
