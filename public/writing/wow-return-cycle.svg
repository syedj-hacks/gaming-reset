<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The World of Warcraft return cycle: you burn out and cancel the subscription, the account waits with every character intact, a new season or expansion is announced, the guild chat wakes up, a free welcome back weekend opens the door, and you resubscribe for launch. The whole loop runs on roughly a two year schedule.">
  <rect width="1200" height="600" rx="20" fill="#ffffff"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="58" font-size="28" font-weight="800" fill="#0f172a">Quitting WoW has a return date built into it</text>
    <text x="600" y="90" font-size="16" font-weight="600" fill="#64748b">Nothing here requires you to be weak. It requires you to still have an account.</text>
  </g>

  <!-- five stages -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="150" width="196" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="158" y="192" font-size="15" font-weight="800" fill="#0f172a">You burn out and</text>
    <text x="158" y="212" font-size="15" font-weight="800" fill="#0f172a">cancel the sub</text>
    <text x="158" y="236" font-size="13" font-weight="600" fill="#94a3b8">This part feels final</text>

    <rect x="281" y="150" width="196" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="379" y="192" font-size="15" font-weight="800" fill="#0f172a">The account waits.</text>
    <text x="379" y="212" font-size="15" font-weight="800" fill="#0f172a">Nothing is deleted.</text>
    <text x="379" y="236" font-size="13" font-weight="600" fill="#94a3b8">Every character intact</text>

    <rect x="502" y="150" width="196" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="600" y="192" font-size="15" font-weight="800" fill="#0f172a">A new season or</text>
    <text x="600" y="212" font-size="15" font-weight="800" fill="#0f172a">expansion lands</text>
    <text x="600" y="236" font-size="13" font-weight="600" fill="#94a3b8">Ratings wiped, ladder fresh</text>

    <rect x="723" y="150" width="196" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="821" y="192" font-size="15" font-weight="800" fill="#0f172a">The old guild chat</text>
    <text x="821" y="212" font-size="15" font-weight="800" fill="#0f172a">wakes up</text>
    <text x="821" y="236" font-size="13" font-weight="600" fill="#94a3b8">"Are you coming back?"</text>

    <rect x="944" y="150" width="196" height="104" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="1042" y="192" font-size="15" font-weight="800" fill="#1e40af">A free weekend</text>
    <text x="1042" y="212" font-size="15" font-weight="800" fill="#1e40af">opens the door</text>
    <text x="1042" y="236" font-size="13" font-weight="600" fill="#3b82f6">Then you resubscribe</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#cbd5e1" stroke-width="3" fill="none">
    <path d="M256 202 L273 202"/>
    <path d="M477 202 L494 202"/>
    <path d="M698 202 L715 202"/>
    <path d="M919 202 L936 202"/>
  </g>
  <g fill="#cbd5e1">
    <path d="M277 202 l-12 -6 l0 12 z"/>
    <path d="M498 202 l-12 -6 l0 12 z"/>
    <path d="M719 202 l-12 -6 l0 12 z"/>
    <path d="M940 202 l-12 -6 l0 12 z"/>
  </g>

  <!-- loop back -->
  <path d="M1042 254 L1042 330 L158 330 L158 254" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M158 254 l-6 12 l12 0 z" fill="#3b82f6"/>
  <text x="600" y="322" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#3b82f6">three good months, then the same burnout, on roughly a two year schedule</text>

  <!-- the counter-fact -->
  <rect x="150" y="382" width="900" height="118" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="418" font-size="15" font-weight="800" fill="#15803d">The part worth noticing</text>
    <text x="600" y="448" font-size="16" font-weight="600" fill="#166534">Inactive accounts keep every character, and Blizzard runs free Welcome Back</text>
    <text x="600" y="470" font-size="16" font-weight="600" fill="#166534">weekends that hand lapsed players full access to all of them.</text>
  </g>

  <text x="600" y="548" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">You did not fail to quit five times. You unsubscribed five times, which is a different thing.</text>
</svg>
