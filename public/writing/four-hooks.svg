<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="The four hooks that keep players in the game: variable reward, sunk cost, social obligation, and identity.">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="560" rx="20" fill="#ffffff"/>

  <!-- Card 1: Variable reward -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="40" y="40" width="460" height="200" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="80" cy="82" r="20" fill="url(#badge)"/>
    <text x="80" y="89" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
    <text x="116" y="90" font-size="24" font-weight="800" fill="#0f172a">Variable reward</text>
    <text x="40" y="150" font-size="16" fill="#475569">
      <tspan x="80" dy="0">Unpredictable wins spike hardest</tspan>
      <tspan x="80" dy="26">right after a loss.</tspan>
    </text>
  </g>

  <!-- Card 2: Sunk cost -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="540" y="40" width="460" height="200" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="580" cy="82" r="20" fill="url(#badge)"/>
    <text x="580" y="89" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
    <text x="616" y="90" font-size="24" font-weight="800" fill="#0f172a">Sunk cost</text>
    <text x="580" y="150" font-size="16" fill="#475569">
      <tspan x="580" dy="0">Your hours, MMR and items start</tspan>
      <tspan x="580" dy="26">to feel like things you own.</tspan>
    </text>
  </g>

  <!-- Card 3: Social obligation -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="40" y="280" width="460" height="200" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="80" cy="322" r="20" fill="url(#badge)"/>
    <text x="80" y="329" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
    <text x="116" y="330" font-size="24" font-weight="800" fill="#0f172a">Social obligation</text>
    <text x="80" y="390" font-size="16" fill="#475569">
      <tspan x="80" dy="0">The party invite turns leaving</tspan>
      <tspan x="80" dy="26">into letting people down.</tspan>
    </text>
  </g>

  <!-- Card 4: Identity -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="540" y="280" width="460" height="200" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="580" cy="322" r="20" fill="url(#badge)"/>
    <text x="580" y="329" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
    <text x="616" y="330" font-size="24" font-weight="800" fill="#0f172a">Identity</text>
    <text x="580" y="390" font-size="16" fill="#475569">
      <tspan x="580" dy="0">"I play Dota" quietly becomes</tspan>
      <tspan x="580" dy="26">"I am a Dota player."</tspan>
    </text>
  </g>

  <text x="520" y="524" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">All four pull in the same direction, at the same time.</text>
</svg>
