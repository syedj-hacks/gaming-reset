<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680" role="img" aria-label="Six signs gaming has crossed the line: you have tried to cut back and could not; gaming comes before sleep, work, or people; you keep playing even when it is hurting you; you feel restless or irritable when you cannot play; you hide or downplay how much you play; and the rest of your life is quietly shrinking.">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="680" rx="20" fill="#ffffff"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="520" y="54" font-size="27" font-weight="800" fill="#0f172a">6 signs it has crossed the line</text>
    <text x="520" y="86" font-size="16" font-weight="600" fill="#64748b">When gaming stops being a choice</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- 1 -->
    <rect x="40" y="120" width="460" height="150" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="80" cy="178" r="18" fill="url(#badge)"/>
    <text x="80" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
    <text x="112" y="172" font-size="19" font-weight="600" fill="#0f172a">You have tried to cut back</text>
    <text x="112" y="200" font-size="19" font-weight="600" fill="#0f172a">and could not.</text>

    <!-- 2 -->
    <rect x="540" y="120" width="460" height="150" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="580" cy="178" r="18" fill="url(#badge)"/>
    <text x="580" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <text x="612" y="172" font-size="19" font-weight="600" fill="#0f172a">Gaming comes before sleep,</text>
    <text x="612" y="200" font-size="19" font-weight="600" fill="#0f172a">work, or people.</text>

    <!-- 3 -->
    <rect x="40" y="298" width="460" height="150" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="80" cy="356" r="18" fill="url(#badge)"/>
    <text x="80" y="363" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
    <text x="112" y="350" font-size="19" font-weight="600" fill="#0f172a">You keep playing even when</text>
    <text x="112" y="378" font-size="19" font-weight="600" fill="#0f172a">it is clearly hurting you.</text>

    <!-- 4 -->
    <rect x="540" y="298" width="460" height="150" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="580" cy="356" r="18" fill="url(#badge)"/>
    <text x="580" y="363" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
    <text x="612" y="350" font-size="19" font-weight="600" fill="#0f172a">You feel restless or irritable</text>
    <text x="612" y="378" font-size="19" font-weight="600" fill="#0f172a">when you cannot play.</text>

    <!-- 5 -->
    <rect x="40" y="476" width="460" height="150" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="80" cy="534" r="18" fill="url(#badge)"/>
    <text x="80" y="541" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">5</text>
    <text x="112" y="528" font-size="19" font-weight="600" fill="#0f172a">You hide or downplay</text>
    <text x="112" y="556" font-size="19" font-weight="600" fill="#0f172a">how much you really play.</text>

    <!-- 6 -->
    <rect x="540" y="476" width="460" height="150" rx="16" fill="#f8fafc" stroke="#e6e8ee" stroke-width="1.5"/>
    <circle cx="580" cy="534" r="18" fill="url(#badge)"/>
    <text x="580" y="541" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">6</text>
    <text x="612" y="528" font-size="19" font-weight="600" fill="#0f172a">The rest of your life</text>
    <text x="612" y="556" font-size="19" font-weight="600" fill="#0f172a">is quietly shrinking.</text>
  </g>

  <text x="520" y="662" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">A few of these hitting matters far more than any number on a clock.</text>
</svg>
